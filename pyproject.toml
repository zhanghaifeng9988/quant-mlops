[project]
name = "quant-mlops-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "lightgbm>=4.7.0",
    "mlflow>=2.9",
    "pandas>=3.0.6",
    "pyarrow>=14,<20",
    "scikit-learn>=1.9.1",
